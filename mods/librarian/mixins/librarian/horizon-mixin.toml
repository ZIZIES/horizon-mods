[mod]
id = "librarian"
version = "1.0.0"
priority = 100

# Pinned: besides the native hook points it changes three functions of the
# game's own (the two that read and write hotbar.nbt, and the creative tab's
# title), so it builds on this commit (Nightly 2026-11-13).
[compatibility]
horizon_revision = "9f42064c11efe7ef3e5ed2baad7ddc2a3b36eea0"

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "librarian"
source = "runtime.rs"

[[module]]
id = "glue"
file = "crates/horizon-client/src/game.rs"
name = "librarian_glue"
source = "glue.rs"

# ---- native hook points

[[injection]]
id = "list"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]

[[injection]]
id = "settings"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_settings"
