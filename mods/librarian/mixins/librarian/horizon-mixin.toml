# ---- the game's own functions (crates/horizon-client/src/game/creative_hotbar.rs)

# pub(super) fn refresh_saved_hotbars(&mut self)
# Taken over at its head while the mod is on (it reads `hotbar.nbt` by a fixed
# name, and the tool changes nothing inside a body with closures): the same
# rows and hints, from the current page's file.
[[injection]]
id = "refresh"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::creative_hotbar::Game<'_>::refresh_saved_hotbars"
helper = "refresh.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

# pub(super) fn hotbar_load_or_save(&mut self, index: usize, load: bool)
# Taken over the same way, with the overwrite check before a save.
[[injection]]
id = "load-or-save"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::creative_hotbar::Game<'_>::hotbar_load_or_save"
helper = "load_or_save.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "index", ty = "usize", value = "index" },
  { name = "load", ty = "bool", value = "load" },
]

# crates/horizon-client/src/game/creative_screen.rs
# pub(super) fn creative_tab_title(&self, tab: &horizon_client::creative::Tab) -> String
[[injection]]
id = "title"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::creative_screen::Game<'_>::creative_tab_title"
helper = "title.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "self" },
  { name = "tab", ty = "&horizon_client::creative::Tab", value = "tab" },
]
